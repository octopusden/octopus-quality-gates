# PUBLIC — releases the plugin to Maven Central: version from the latest vX.Y.Z tag, Central
# Portal publish (which confirms every artifact in the deployment is resolvable before anything
# is tagged), tag, GitHub release and octopus-release-log entry. The plugin marker is checked
# only because java-gradle-plugin always publishes it: the shared workflow cannot yet require
# specific coordinates, as octopus-base's publish-quality-plugin did with REQUIRE_COORDS.
name: Gradle Release

on:
  workflow_dispatch:
    inputs:
      increment-version-level:
        description: Semver level to bump the latest tag by
        required: false
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      dry-run:
        description: Run the release flow without publishing or creating a release
        required: false
        type: boolean
        default: false
      resume-deployment-id:
        description: >-
          Portal deployment id printed by a failed run as RELEASE_PUBLISH_RESUME_DEPLOYMENT_ID.
          Publishes that deployment instead of uploading the version again.
        required: false
        type: string
        default: ''

# contents: write to create the tag and the GitHub release.
permissions:
  contents: write

# Two overlapping releases would compute the same version and upload it twice. Queue rather
# than cancel: a cancelled run can leave an unpublished deployment behind.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-release.yml@v3.2.0
    with:
      flow-type: public
      java-version: '17'
      increment-version-level: ${{ inputs.increment-version-level }}
      dry-run: ${{ inputs.dry-run }}
      resume-deployment-id: ${{ inputs.resume-deployment-id }}
      # Registration lives in the release job: exact version from the build, gated on !dry-run.
      # A workflow_run listener would also fire after a dry run and fail to find a release.
      register-release-immediately: true
    secrets: inherit
